    definition_changes:
      ceil_cond:
        v6.2.0:
          name: ceil_cond
          description: The physical condition of the ceiling at the time of sampling;
            photos or video preferred; use drawings to indicate location of damaged
            areas
          title: ceiling condition
          range: SHARED_ENUM_3
        main:
          name: ceil_cond
          description: The physical condition of the ceiling at the time of sampling;
            photos or video preferred; use drawings to indicate location of damaged
            areas
          title: ceiling condition
          range: DamagedEnum
      water_source_adjac:
        v6.2.0:
          name: water_source_adjac
          description: Description of the environmental features that are adjacent
            to the farm water source. This field accepts terms under ecosystem (http://purl.obolibrary.org/obo/ENVO_01001110)
            and human construction (http://purl.obolibrary.org/obo/ENVO_00000070).
            Multiple terms can be separated by pipes
          title: environmental feature adjacent water source
          multivalued: true
        main:
          name: water_source_adjac
          description: Description of the environmental features that are adjacent
            to the farm water source. This field accepts terms under ecosystem (http://purl.obolibrary.org/obo/ENVO_01001110)
            and human construction (http://purl.obolibrary.org/obo/ENVO_00000070).
            Multiple terms can be separated by pipes
          title: environmental feature adjacent water source
          range: string
          multivalued: true
      fertilizer_admin:
        v6.2.0:
          name: fertilizer_admin
          description: Type of fertilizer or amendment added to the soil or water
            for the purpose of improving substrate health and quality for plant growth.
            This field accepts terms listed under agronomic fertilizer (http://purl.obolibrary.org/obo/AGRO_00002062).
            Multiple terms may apply and can be separated by pipes, listing in reverse
            chronological order
          title: fertilizer administration
          pattern: ^([^\s-]{1,2}|[^\s-]+.+[^\s-]+) \[[a-zA-Z]{2,}:[a-zA-Z0-9]\d+\]$
          range: string
        main:
          name: fertilizer_admin
          description: Type of fertilizer or amendment added to the soil or water
            for the purpose of improving substrate health and quality for plant growth.
            This field accepts terms listed under agronomic fertilizer (http://purl.obolibrary.org/obo/AGRO_00002062).
            Multiple terms may apply and can be separated by pipes, listing in reverse
            chronological order
          title: fertilizer administration
          pattern: ^([^\s-]{1,2}|[^\s-]+.+[^\s-]+) \[[a-zA-Z][a-zA-Z0-9._]*:[a-zA-Z0-9]+\]$
          range: string
      mimag_symbiont_associated_data:
        v6.2.0:
          name: mimag_symbiont_associated_data
          description: Data that complies with Mimag combined with SymbiontAssociated
          title: MimagSymbiontAssociated data
          range: MimagSymbiontAssociated
          multivalued: true
        main:
          name: mimag_symbiont_associated_data
          description: Data that comply with Mimag combined with SymbiontAssociated
          title: MimagSymbiontAssociated data
