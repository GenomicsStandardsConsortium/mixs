      assembly_qual:
        v6.2.0:
          name: assembly_qual
          description: 'The assembly quality category is based on sets of criteria
            outlined for each assembly quality category. For MISAG/MIMAG; Finished:
            Single, validated, contiguous sequence per replicon without gaps or ambiguities
            with a consensus error rate equivalent to Q50 or better. High Quality
            Draft:Multiple fragments where gaps span repetitive regions. Presence
            of the 23S, 16S and 5S rRNA genes and at least 18 tRNAs. Medium Quality
            Draft:Many fragments with little to no review of assembly other than reporting
            of standard assembly statistics. Low Quality Draft:Many fragments with
            little to no review of assembly other than reporting of standard assembly
            statistics. Assembly statistics include, but are not limited to total
            assembly size, number of contigs, contig N50/L50, and maximum contig length.
            For MIUVIG; Finished: Single, validated, contiguous sequence per replicon
            without gaps or ambiguities, with extensive manual review and editing
            to annotate putative gene functions and transcriptional units. High-quality
            draft genome: One or multiple fragments, totaling   90% of the expected
            genome or replicon sequence or predicted complete. Genome fragment(s):
            One or multiple fragments, totalling < 90% of the expected genome or replicon
            sequence, or for which no genome size could be estimated'
          title: assembly quality
        main:
          name: assembly_qual
          description: 'The assembly quality category is based on sets of criteria
            outlined for each assembly quality category. For MISAG/MIMAG; Finished:
            Single, validated, contiguous sequence per replicon without gaps or ambiguities
            with a consensus error rate equivalent to Q50 or better. High Quality
            Draft:Multiple fragments where gaps span repetitive regions. Presence
            of the large subunit (LSU) RNA, small subunit (SSU) and the presence of
            5.8S rRNA or 5S rRNA depending on whether it is a eukaryotic or prokaryotic
            genome, respectively. Medium Quality Draft:Many fragments with little
            to no review of assembly other than reporting of standard assembly statistics.
            Low Quality Draft:Many fragments with little to no review of assembly
            other than reporting of standard assembly statistics. Assembly statistics
            include, but are not limited to total assembly size, number of contigs,
            contig N50/L50, and maximum contig length. For MIUVIG; Finished: Single,
            validated, contiguous sequence per replicon without gaps or ambiguities,
            with extensive manual review and editing to annotate putative gene functions
            and transcriptional units. High-quality draft genome: One or multiple
            fragments, totaling   90% of the expected genome or replicon sequence
            or predicted complete. Genome fragment(s): One or multiple fragments,
            totalling < 90% of the expected genome or replicon sequence, or for which
            no genome size could be estimated'
          title: assembly quality
          range: AssemblyQualEnum
