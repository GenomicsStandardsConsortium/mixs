scalar_differences:
  description:
    main: MIxS, the Minimum Information about any (x) Sequence, is a standard from
      the Genomic Standards Consortium (GSC, https://www.gensc.org/) for reporting
      contextual metadata about sequenced samples. It defines checklists for genomic
      sequence types (for example genomes, metagenomes, and marker genes), environmental
      extensions, and the terms that populate them. See https://genomicsstandardsconsortium.github.io/mixs/.
  imports:
    main:
    - linkml:types
  see_also:
    main:
    - https://doi.org/10.1038/nbt.1823
  source:
    v6.2.0: https://github.com/GenomicsStandardsConsortium/mixs/raw/issue-610-temp-mixs-xlsx-home/mixs/excel/mixs_v6.xlsx
