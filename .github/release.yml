# Groups the autogenerated release notes. Without this, every release produces
# one flat list in merge order, and a third of it is dependency updates
# interleaved with the schema changes.
#
# Categories are matched in order, and an entry appears in the first category
# whose labels it matches. The catch-all at the end means nothing is dropped
# silently.
changelog:
  categories:
    - title: Schema changes
      labels:
        - 1-TermUpdate
        - 2-NewTerm
        - env_extenstion
    - title: Documentation
      labels:
        - documentation-external
        - documentation-internal
    - title: Build, tooling and CI
      labels:
        - 5-TechnicalUpdates
        - github_actions
        - python
        - python package inc. PyPI
    - title: Dependency updates
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
