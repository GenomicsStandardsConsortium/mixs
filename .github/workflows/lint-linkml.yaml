---
name: LinkML Linting GitHub Action
on:
  pull_request:
    paths:
      - "src/mixs/schema/mixs.yaml"
  workflow_dispatch:  # This allows manual triggering

jobs:
  linkml:
    # Simplified permissions - we only need to upload artifacts
    permissions:
      contents: read
      pull-requests: write  # This is the missing piece!
    name: LinkML Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fixed: Specify exact Python version instead of using undefined matrix variable
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

      # Now we can configure Poetry cache
      - name: Configure Poetry cache
        run: poetry config cache-dir ~/.cache/poetry

      # Install dependencies using Makefile
      - name: Install dependencies
        run: make install

      # Run the LinkML linting command. The exit status is kept so the check fails
      # when the linter finds a problem; the results are written to the job summary
      # first, so the findings are visible even on a fork pull request, where the
      # comment step below cannot run.
      - name: Run LinkML Linting
        run: |
          set -o pipefail
          status=0
          poetry run linkml lint --ignore-warnings -f markdown src/mixs/schema/mixs.yaml > linting-results.md || status=$?

          {
            echo "## LinkML Linting Results"
            echo
            cat linting-results.md
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== Linting Results ==="
          cat linting-results.md
          exit $status

      - name: Comment linting results on PR
        # always() so the comment is still posted when the lint step fails, which is
        # when it is most worth reading.
        #
        # Only this comment is skipped on fork pull requests, never the lint itself.
        # A fork pull request gets a read-only token, so createComment fails with
        # "Resource not accessible by integration". The findings are in the job
        # summary either way, so nothing is lost for a fork contributor.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const lintingResults = fs.readFileSync('linting-results.md', 'utf8');

            // Create or update comment with linting results
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## LinkML Linting Results\n\n${lintingResults}`
            });