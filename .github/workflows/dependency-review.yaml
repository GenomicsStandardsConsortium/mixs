---
name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

# Read-only. The action fails the check by itself when a pull request
# introduces a vulnerable dependency, so it does not need write access.
# Posting the summary as a pull request comment would require
# pull-requests: write, and that write token is not granted to pull requests
# from forks in any case, so the comment would be the first thing to break for
# an external contributor. See
# https://github.com/GenomicsStandardsConsortium/mixs/issues/1272.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
