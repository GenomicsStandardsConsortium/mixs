---
# =============================================================================
# MIxS Release PR Creation Workflow
# =============================================================================
# This workflow automates the MIxS release process by:
# 1. Bumping the version in src/mixs/schema/mixs.yaml, CITATION.cff, .zenodo.json and
#    release/README.md. The schema is bumped first so everything generated from it
#    inherits the same version. The Python package version is derived from the git tag
#    by poetry-dynamic-versioning, so it is not set here.
# 2. Running the full build and test suite (which regenerates the OWL and other artifacts)
# 3. Generating a schema diff report
# 4. Creating a release PR with all changes
#
# Trigger: Manual dispatch with version and diff parameters
# See: https://github.com/turbomam/mixs/issues/106
# =============================================================================

name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number (e.g., 6.2.1 or 7.0.0)'
        required: true
        type: string
      diff_old:
        # Left empty on purpose. A hardcoded default has to be bumped after every
        # release and was stale within a day of the last one, so it is resolved
        # below instead. See #1326.
        #
        # For a base earlier than v6.2.0, diff_old_path must be changed from its
        # default as well: that path does not exist in those releases, and
        # leaving it unchanged fails at the diff step rather than here.
        description: 'Old version: a tag, or a branch whose name has no "/". Leave empty for the most recent full release.'
        required: false
        default: ''
        type: string
      diff_old_path:
        # Releases before v6.2.0 keep the schema under model/schema/, reached
        # through a root file that imports the rest. The diff tool resolves
        # those imports, so only this path needs changing.
        description: 'Schema path in the old version (change only for releases before v6.2.0)'
        required: false
        default: 'src/mixs/schema/mixs.yaml'
        type: string
      diff_new:
        description: 'New version: a tag, or a branch whose name has no "/"'
        required: true
        default: 'main'
        type: string
      diff_new_path:
        description: 'Schema path in the new version'
        required: false
        default: 'src/mixs/schema/mixs.yaml'
        type: string
      skip_tests:
        description: 'Skip running tests (for faster iteration during development)'
        required: false
        default: false
        type: boolean

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate version format
        env:
          # Pass through the environment, not template interpolation, so the
          # value cannot be read as shell syntax before this guard runs.
          VERSION: ${{ inputs.version }}
        run: |
          # X.Y.Z, optionally followed by a semver pre-release identifier, so a
          # rehearsal can run as 7.0.0-rc1 without publishing a real release.
          # Semver build metadata (+build) is deliberately not accepted: the
          # value becomes a git branch name and a tag.
          #
          # Whitespace is reported rather than stripped. Fourteen later
          # references use inputs.version directly to build the branch name and
          # the tag, so trimming here would leave those built from the
          # untrimmed value.
          if [[ "$VERSION" =~ [[:space:]] ]]; then
            echo "Error: version contains whitespace: '$VERSION'"
            echo "Retype the value rather than pasting it, then dispatch again."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Error: Version must be X.Y.Z or X.Y.Z-prerelease (e.g., 6.2.1, 7.0.0, 7.0.0-rc1, 7.0.0-alpha.2)"
            echo "Received: '$VERSION'"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for diff script
          # The token is not written into .git/config. The one command that needs it,
          # the branch push below, supplies it directly, so no later step in this job
          # can read a credential it does not need.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git checkout -b "release/v${VERSION}"

      # Must run before the build below, because every generated artifact inherits
      # its version from this file. It used to be bumped by hand in a separate pull
      # request merged beforehand, which is what allowed the schema and the generated
      # files to carry different versions.
      - name: Bump the schema version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version: .*/version: ${VERSION}/" src/mixs/schema/mixs.yaml
          # sed -i exits 0 whether or not it matched, so confirm it took effect.
          found=$(grep -m1 '^version:' src/mixs/schema/mixs.yaml | sed 's/^version:[[:space:]]*//')
          if [ "$found" != "$VERSION" ]; then
            echo "::error::Failed to set the schema version. src/mixs/schema/mixs.yaml reads '$found', expected '$VERSION'."
            exit 1
          fi
          echo "src/mixs/schema/mixs.yaml is now $found."

      - name: Bump version in CITATION.cff
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" CITATION.cff
          sed -i 's/^date-released: .*/date-released: "'"$(date +%Y-%m-%d)"'"/' CITATION.cff

      - name: Bump version in .zenodo.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" .zenodo.json

      - name: Update version references in documentation
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Update the "Current version" link in release/README.md. The pattern
          # has to match a pre-release suffix too, otherwise the substitution
          # silently stops matching after the first X.Y.Z-rc1 release and the
          # file keeps showing a stale version.
          sed -i 's|Current version: \[MIxS v[0-9]\+\.[0-9]\+\.[0-9]\+\(-[0-9A-Za-z.-]\+\)\?\]|Current version: [MIxS v'"${VERSION}"']|g' release/README.md
          sed -i 's|releases/tag/v[0-9]\+\.[0-9]\+\.[0-9]\+\(-[0-9A-Za-z.-]\+\)\?)|releases/tag/v'"${VERSION}"')|g' release/README.md

      - name: Run build and tests
        if: ${{ !inputs.skip_tests }}
        run: make install clean all test

      - name: Run build only (skip tests)
        if: ${{ inputs.skip_tests }}
        run: make install clean all

      - name: Resolve the diff baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DIFF_OLD_INPUT: ${{ inputs.diff_old }}
        run: |
          set -euo pipefail
          # This value reaches $GITHUB_ENV, so it is checked here rather than at
          # the diff step: anything written there takes effect before that step
          # runs, and a newline in it could set a second variable that the guard
          # there would then see as clean.
          if [ -n "$DIFF_OLD_INPUT" ]; then
            if ! [[ "$DIFF_OLD_INPUT" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::diff_old '$DIFF_OLD_INPUT' must contain only letters, digits, '.', '_', or '-'."
              exit 1
            fi
            printf 'DIFF_OLD=%s\n' "$DIFF_OLD_INPUT" >> "$GITHUB_ENV"
            echo "Using the baseline given: $DIFF_OLD_INPUT"
            exit 0
          fi

          # The most recent full release, excluding pre-releases and anything
          # before v6.2.0. Earlier tags keep the schema at model/schema/mixs.yaml,
          # so they need diff_old_path changed as well and cannot be a default.
          baseline=$(gh release list --limit 100 --exclude-pre-releases \
                       --json tagName --jq '.[].tagName' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                     | sort -V | tail -1 || true)

          if [ -z "$baseline" ]; then
            echo "::error::Could not resolve a baseline release. Pass diff_old explicitly."
            exit 1
          fi
          printf 'DIFF_OLD=%s\n' "$baseline" >> "$GITHUB_ENV"
          echo "Resolved the baseline to the most recent full release: $baseline"

      - name: Generate schema diff report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the workflow inputs through the environment rather than
          # templating them into the script, so their values cannot be
          # interpreted as shell syntax or path segments.
          DIFF_NEW: ${{ inputs.diff_new }}
          DIFF_OLD_PATH: ${{ inputs.diff_old_path }}
          DIFF_NEW_PATH: ${{ inputs.diff_new_path }}
        run: |
          # Guard against path traversal / nesting: these refs become a directory
          # name, so reject anything but a simple ref token (tags, main, etc.).
          for ref in "$DIFF_OLD" "$DIFF_NEW"; do
            if ! [[ "$ref" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Error: diff ref '$ref' must contain only letters, digits, '.', '_', or '-' (no '/' or '..')"
              exit 1
            fi
          done
          # The paths are not refs and do contain slashes, so they get their
          # own guard: relative only, no traversal.
          for pth in "$DIFF_OLD_PATH" "$DIFF_NEW_PATH"; do
            if ! [[ "$pth" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$pth" == /* ]] || [[ "$pth" == *..* ]]; then
              echo "Error: schema path '$pth' must be a relative path without '..'"
              exit 1
            fi
          done
          out_dir="assets/diff_results/${DIFF_OLD}_to_${DIFF_NEW}"
          mkdir -p "$out_dir"
          poetry run diff-releases \
            --old "GenomicsStandardsConsortium/mixs@${DIFF_OLD}:${DIFF_OLD_PATH}" \
            --new "GenomicsStandardsConsortium/mixs@${DIFF_NEW}:${DIFF_NEW_PATH}" \
            --output-dir "$out_dir" \
            --mappings-dir assets/between_diff_mappings/6_to_pre_7

          # The release pull request body claims a diff was generated, so a
          # silent failure here would publish a release that says so untruthfully.
          if [ ! -s "$out_dir/schema_comparison_results.yaml" ]; then
            echo "::error::diff-releases produced no $out_dir/schema_comparison_results.yaml"
            echo "::error::Check that ${DIFF_OLD_PATH} exists at ${DIFF_OLD}: releases before v6.2.0 keep the schema at model/schema/mixs.yaml."
            exit 1
          fi

      - name: Commit changes
        env:
          VERSION: ${{ inputs.version }}
          DIFF_NEW: ${{ inputs.diff_new }}
        run: |
          git add -A
          git commit -m "Release v${VERSION}

          - Bump version to ${VERSION}
          - Update CITATION.cff and .zenodo.json
          - Generate schema diff: ${DIFF_OLD} vs ${DIFF_NEW}
          - Run full build and test suite"

      - name: Push release branch
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:refs/heads/release/v${VERSION}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DIFF_NEW: ${{ inputs.diff_new }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The body is written with placeholders inside a quoted heredoc, then
          # filled in by python. A quoted heredoc does not expand $VAR, and an
          # unquoted one would treat the markdown backticks below as command
          # substitution, so neither shell form is usable directly.
          cat > /tmp/release-pr-body.md <<'BODY'
          ## Release v@@VERSION@@

          This PR was automatically generated by the release workflow.

          ### Changes
          - Version bumped to @@VERSION@@ in:
            - `src/mixs/schema/mixs.yaml`, and everything generated from it
            - `CITATION.cff`
            - `.zenodo.json`
            - `release/README.md`

          `pyproject.toml` is not listed: the Python package version is derived
          from the git tag by poetry-dynamic-versioning.
          - Schema diff generated: `@@DIFF_OLD@@` vs `@@DIFF_NEW@@`
          - Full build and test suite executed

          ### Schema Diff
          The structured diff is in `assets/diff_results/@@DIFF_OLD@@_to_@@DIFF_NEW@@/schema_comparison_results.yaml`.
          Before review, add a readable summary to this branch by running the
          diff-summary skill on that file and committing the result (see
          `src/docs/releasing.md`, "Adding the schema-diff summaries and publishing them").

          ### Pre-merge Checklist
          - [ ] Review version numbers are correct
          - [ ] Generate and commit the schema-diff summary on this branch
          - [ ] Review schema diff summary for unexpected changes
          - [ ] Verify all tests passed
          - [ ] TWG approval
          - [ ] CIG approval (for major releases)

          ### Post-merge Steps
          1. Approve the workflows on this pull request, or it will have no checks
          2. Merge this PR
          3. Create GitHub Release with tag `v@@VERSION@@`, targeting `main`
          4. Use "Generate release notes" to auto-populate PR summaries
          5. Publish the release

          ---
          *Generated by [create-release-pr.yaml](https://github.com/@@REPOSITORY@@/blob/main/.github/workflows/create-release-pr.yaml)*
          BODY

          python3 - <<'FILL'
          import os, pathlib
          p = pathlib.Path("/tmp/release-pr-body.md")
          text = p.read_text()
          for key in ("VERSION", "DIFF_OLD", "DIFF_NEW", "REPOSITORY"):
              text = text.replace(f"@@{key}@@", os.environ[key])
          p.write_text(text)
          FILL

          gh pr create \
            --title "Release v${VERSION}" \
            --body-file /tmp/release-pr-body.md \
            --base main \
            --head "release/v${VERSION}"
