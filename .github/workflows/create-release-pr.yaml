---
# =============================================================================
# MIxS Release PR Creation Workflow
# =============================================================================
# This workflow automates the MIxS release process by:
# 1. Bumping the version in CITATION.cff, .zenodo.json, and release/README.md.
#    The Python package version is derived from the git tag by poetry-dynamic-versioning,
#    and the schema version in src/mixs/schema/mixs.yaml is bumped by hand before running
#    this workflow (see src/docs/edit_workflow.md), so neither is set here.
# 2. Running the full build and test suite (which regenerates the OWL and other artifacts)
# 3. Generating a schema diff report
# 4. Creating a release PR with all changes
#
# Trigger: Manual dispatch with version and diff parameters
# See: https://github.com/turbomam/mixs/issues/106
# =============================================================================

name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number (e.g., 6.2.1 or 7.0.0)'
        required: true
        type: string
      diff_old:
        description: 'Old version for diff comparison (tag or branch)'
        required: true
        default: 'mixs6.0.0'
        type: string
      diff_new:
        description: 'New version for diff comparison (tag or branch)'
        required: true
        default: 'main'
        type: string
      skip_tests:
        description: 'Skip running tests (for faster iteration during development)'
        required: false
        default: false
        type: boolean

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate version format
        env:
          # Pass through the environment, not template interpolation, so the
          # value cannot be read as shell syntax before this guard runs.
          VERSION: ${{ inputs.version }}
        run: |
          # X.Y.Z, optionally followed by a semver pre-release identifier, so a
          # rehearsal can run as 7.0.0-rc1 without publishing a real release.
          # Semver build metadata (+build) is deliberately not accepted: the
          # value becomes a git branch name and a tag.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Error: Version must be X.Y.Z or X.Y.Z-prerelease (e.g., 6.2.1, 7.0.0, 7.0.0-rc1, 7.0.0-alpha.2)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff script

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          git checkout -b release/v${{ inputs.version }}

      - name: Bump version in CITATION.cff
        run: |
          sed -i 's/^version: .*/version: ${{ inputs.version }}/' CITATION.cff
          sed -i 's/^date-released: .*/date-released: "'$(date +%Y-%m-%d)'"/' CITATION.cff

      - name: Bump version in .zenodo.json
        run: |
          sed -i 's/"version": ".*"/"version": "${{ inputs.version }}"/' .zenodo.json

      - name: Update version references in documentation
        run: |
          # Update the "Current version" link in release/README.md. The pattern
          # has to match a pre-release suffix too, otherwise the substitution
          # silently stops matching after the first X.Y.Z-rc1 release and the
          # file keeps showing a stale version.
          sed -i 's|Current version: \[MIxS v[0-9]\+\.[0-9]\+\.[0-9]\+\(-[0-9A-Za-z.-]\+\)\?\]|Current version: [MIxS v${{ inputs.version }}]|g' release/README.md
          sed -i 's|releases/tag/v[0-9]\+\.[0-9]\+\.[0-9]\+\(-[0-9A-Za-z.-]\+\)\?)|releases/tag/v${{ inputs.version }})|g' release/README.md

      - name: Run build and tests
        if: ${{ !inputs.skip_tests }}
        run: make install clean all test

      - name: Run build only (skip tests)
        if: ${{ inputs.skip_tests }}
        run: make install clean all

      - name: Generate schema diff report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the workflow inputs through the environment rather than
          # templating them into the script, so their values cannot be
          # interpreted as shell syntax or path segments.
          DIFF_OLD: ${{ inputs.diff_old }}
          DIFF_NEW: ${{ inputs.diff_new }}
        run: |
          # Guard against path traversal / nesting: these refs become a directory
          # name, so reject anything but a simple ref token (tags, main, etc.).
          for ref in "$DIFF_OLD" "$DIFF_NEW"; do
            if ! [[ "$ref" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Error: diff ref '$ref' must contain only letters, digits, '.', '_', or '-' (no '/' or '..')"
              exit 1
            fi
          done
          out_dir="assets/diff_results/${DIFF_OLD}_to_${DIFF_NEW}"
          mkdir -p "$out_dir"
          poetry run diff-releases \
            --old "GenomicsStandardsConsortium/mixs@${DIFF_OLD}:src/mixs/schema/mixs.yaml" \
            --new "GenomicsStandardsConsortium/mixs@${DIFF_NEW}:src/mixs/schema/mixs.yaml" \
            --output-dir "$out_dir" \
            --mappings-dir assets/between_diff_mappings/6_to_pre_7 \
            || echo "Diff generation encountered issues - check logs"

      - name: Commit changes
        run: |
          git add -A
          git commit -m "Release v${{ inputs.version }}

          - Bump version to ${{ inputs.version }}
          - Update CITATION.cff and .zenodo.json
          - Generate schema diff: ${{ inputs.diff_old }} vs ${{ inputs.diff_new }}
          - Run full build and test suite"

      - name: Push release branch
        run: |
          git push -u origin release/v${{ inputs.version }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Release v${{ inputs.version }}" \
            --body "$(cat <<'EOF'
          ## Release v${{ inputs.version }}

          This PR was automatically generated by the release workflow.

          ### Changes
          - Version bumped to ${{ inputs.version }} in:
            - `CITATION.cff`
            - `.zenodo.json`
            - `release/README.md`

            `pyproject.toml` is not listed: the Python package version is derived
            from the git tag by poetry-dynamic-versioning. The schema version in
            `src/mixs/schema/mixs.yaml` is bumped by hand before this workflow runs.
          - Schema diff generated: `${{ inputs.diff_old }}` vs `${{ inputs.diff_new }}`
          - Full build and test suite executed

          ### Schema Diff
          The structured diff is in `assets/diff_results/${{ inputs.diff_old }}_to_${{ inputs.diff_new }}/schema_comparison_results.yaml`.
          Before review, add a readable summary to this branch by running the
          diff-summary skill on that file and committing the result (see
          `src/docs/edit_workflow.md`, "Adding the schema-diff summaries and publishing them").

          ### Pre-merge Checklist
          - [ ] Review version numbers are correct
          - [ ] Generate and commit the schema-diff summary on this branch
          - [ ] Review schema diff summary for unexpected changes
          - [ ] Verify all tests passed
          - [ ] TWG approval
          - [ ] CIG approval (for major releases)

          ### Post-merge Steps
          1. Merge this PR
          2. Create GitHub Release with tag `v${{ inputs.version }}`
          3. Use "Generate release notes" to auto-populate PR summaries
          4. Publish the release

          ---
          *Generated by [create-release-pr.yaml](https://github.com/${{ github.repository }}/blob/main/.github/workflows/create-release-pr.yaml)*
          EOF
          )" \
            --base main \
            --head release/v${{ inputs.version }}
