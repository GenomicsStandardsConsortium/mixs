---
name: Yamllint GitHub Action

on:
  pull_request:
  workflow_dispatch:

# Least privilege: read the repo, plus write PR comments for yamllint results.
permissions:
  contents: read
  pull-requests: write

jobs:
  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Yamllint
      uses: karancode/yamllint-github-action@4052d365f09b8d34eb552c363d1141fd60e2aeb2 # master
      with:
        yamllint_file_or_dir: src/mixs/schema
        yamllint_config_filepath: .yamllint
        yamllint_strict: false
        yamllint_comment: true
      env:
        GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
