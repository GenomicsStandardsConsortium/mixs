name: Verify generated artifacts

# The generated files committed under project/, src/mixs/datamodel/, and contrib/ are read
# directly by downstream consumers; EBI OLS loads project/owl/mixs.owl.ttl from raw main.
# Keeping them matching src/mixs/schema/mixs.yaml is the intent (#1240). This workflow does
# not achieve that, and #1303 tracks what to do about it.
#
# The OWL is not byte-reproducible: RDF/Turtle serialization reorders triples and relabels
# blank nodes on every run (same 46k triples, different text), so it cannot be verified by a
# text diff. project/jsonschema/mixs.schema.json IS fully deterministic and carries no
# generation timestamp, so it is compared to decide whether the schema content changed:
#   - pull_request / manual dispatch: regenerate and FAIL if a committed
#     deterministic artifact differs.
#
# The JSON Schema alone was not enough. It carries no class_uri values, so a change
# confined to identifiers left it identical and passed; that is how eight malformed
# combination identifiers reached a release (#1347). project/jsonld/mixs.jsonld does
# carry every class_uri (347 of them), so it is compared too, which closes that gap.
#
# The JSON-LD records generation_date and source_file_date. git does not preserve
# mtimes, so both differ on every clone and a whole-file diff would always fail. Those
# two lines are filtered out of the comparison only; nothing on disk is rewritten.
#
# The push-to-main regenerate job was removed. It pushed straight to main, which branch
# protection refuses, so it never committed anything on this repository. Cutting a
# release is what refreshes the committed artifacts (#1303).

on:
  pull_request:
    # Deliberately narrower than the push trigger was: a pull request that only edits
    # the schema is not checked here. Build inputs are still checked, where
    # regenerating catches a real regression.
    paths:
      - 'src/sparql/**'
      - 'project-generator-config.yaml'
      - 'Makefile'
  workflow_dispatch:

# Least privilege by default; only the push-to-main job that commits needs write.
permissions:
  contents: read

jobs:
  verify:
    # Runs on pull requests and manual dispatch with a read-only token, so untrusted PR code
    # executed via `make` cannot push to the repo.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

      - name: Install dependencies
        run: make install

      - name: Regenerate the JSON Schema, which is deterministic
        run: make gen-project

      - name: Fail if the committed JSON Schema is out of sync
        run: |
          set -uo pipefail
          status=0

          # The JSON Schema carries no generation timestamp, so compare it whole.
          # git add -A so a newly created (untracked) output is detected, not just edits.
          git add -A project/jsonschema/
          if git diff --staged --quiet -- project/jsonschema/; then
            echo "project/jsonschema/mixs.schema.json is in sync with the schema."
          else
            echo "::error::project/jsonschema/mixs.schema.json is out of sync with src/mixs/schema/mixs.yaml. Run 'make gen-project' (and 'make owl' / 'make all-contrib') and commit the results."
            git diff --staged --stat -- project/jsonschema/
            status=1
          fi

          # The JSON-LD is the same content, but it records when it was generated
          # and when its source was last touched. git does not preserve mtimes, so
          # both differ on every clone and a whole-file diff would always fail.
          # Those two lines are filtered out of the comparison only; nothing on disk
          # is rewritten, so the committed file keeps its timestamps.
          VOLATILE='"(generation_date|source_file_date)"'
          if diff -q <(git show HEAD:project/jsonld/mixs.jsonld | grep -vE "$VOLATILE") \
                     <(grep -vE "$VOLATILE" project/jsonld/mixs.jsonld) > /dev/null; then
            echo "project/jsonld/mixs.jsonld is in sync with the schema."
          else
            echo "::error::project/jsonld/mixs.jsonld is out of sync with src/mixs/schema/mixs.yaml, ignoring its generation timestamps."
            status=1
          fi

          exit $status

