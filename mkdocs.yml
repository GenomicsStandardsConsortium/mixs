---
site_name: "mixs"
theme:
  name: material
  # palette:
  #  scheme: slate
  #  primary: cyan
  features:
    - content.tabs.link
    - search.suggest
plugins:
  - search:
      separator: '[\s\-\:\(\)]+'
  - mermaid2
markdown_extensions:
  - tables
  - pymdownx.magiclink
  - footnotes
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
nav:
  # - Home: home.md
  - Index: index.md
  - Full term table: term_list.md
  - Combinations: combinations.md
  - Enumerations: enumerations.md
  - About: about.md
  - Contributing:
    - Editing policies: policy.md
    - Editing workflows: edit_workflow.md
    - Releasing MIxS: releasing.md
    - Deprecating schema elements: schema_element_deprecation_guide.md
  - Writing terms:
    - Term specifications: slot_specifications.md
  - Version changes:
    - v5 to v6.0.0: version-changes/v5_to_v6.0.0.md
    - v5 to v6.0.0 (counts): version-changes/v5_to_v6.0.0-counts.md
    - v6.0.0 to v7.0.0: version-changes/v6.0.0_to_v7.0.0.md
    - v6.0.0 to v7.0.0 (counts): version-changes/v6.0.0_to_v7.0.0-counts.md
    - v7.0.0 to v7.0.1: version-changes/v7.0.0_to_v7.0.1.md
    - v7.0.0 to v7.0.1 (counts): version-changes/v7.0.0_to_v7.0.1-counts.md
  - Developer:
    - Comparing schema versions: SCHEMA_DIFFING.md
site_url: https://GenomicsStandardsConsortium.github.io/mixs
repo_url: https://github.com/GenomicsStandardsConsortium/mixs

docs_dir: docs
# Uncomment this block to enable use of Google Analytics.
# Replace the property value with your own ID.
# extra:
#   analytics:
#     provider: google
#     property: G-XXXXXXXXXX
